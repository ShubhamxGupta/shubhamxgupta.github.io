name: Update LeetCode Stats Daily

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-leetcode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest LeetCode Stats
        run: node scripts/fetch-leetcode.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/leetcode.json
          if git diff --staged --quiet; then
            echo "No changes in LeetCode stats."
          else
            git commit -m "chore(data): auto-update leetcode stats [skip ci]"
            git push
          fi
